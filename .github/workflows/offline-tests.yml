name: Offline regression checks
on: [push, pull_request]
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo -- 2
      # No API keys or live public endpoints in CI.
